pre-commit:
  commands:
    private-terms:
      # Personal context (names, a document's subject) never reaches git. The checker and
      # its term list live in ~/.config/git/, outside every repo; skipped where absent.
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" staged'
    gitleaks:
      run: gitleaks protect --staged --redact

commit-msg:
  commands:
    private-terms:
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" msg {1}'

pre-push:
  commands:
    private-terms:
      # Every commit not on GitHub yet, with its message: catches old history merged back
      # from a stale clone, which the commit checks never see.
      run: 'c="$HOME/.config/git/private-terms-check"; [ ! -x "$c" ] || "$c" push'
